[project]
name = "fzgx-tools"
version = "0.1.0"
description = "Tooling for the F-Zero GX (GFZE01) matching decompilation"
requires-python = ">=3.12"
dependencies = ["mcp>=1.2,<2", "anyio>=4"]

[dependency-groups]
dev = [
    "capstone>=5",
    "pyyaml>=6",
    "toml>=0.10.2",
    "levenshtein>=0.27.4",
]
